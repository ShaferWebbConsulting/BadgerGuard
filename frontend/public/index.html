<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trusted Fusion Gateway — Dashboard</title>
  <script src="/react.production.min.js"></script>
  <script src="/react-dom.production.min.js"></script>
  <script src="/babel.min.js"></script>
  <style>
    /* ── Theme Variables ── */
    :root {
      --bg-body: #0b0e14;
      --bg-panel: #141820;
      --bg-panel-header: #111520;
      --bg-input: #1a1e28;
      --border-panel: #1e2230;
      --border-accent: #3a3f4b;
      --text-primary: #e0e4ec;
      --text-secondary: #c8ccd4;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --text-dimmer: #4b5563;
      --scrollbar-track: #1a1e28;
      --scrollbar-thumb: #3a3f4b;
      --sim-panel-bg: #1a1520;
      --sim-panel-border: #4a2040;
      --table-row-hover: #181c26;
      --badge-zt-bg: #0e2a1e;
      --badge-sandbox-bg: #1e1a30;
      --modal-overlay: rgba(0,0,0,0.7);
    }
    [data-theme="light"] {
      --bg-body: #f3f4f6;
      --bg-panel: #ffffff;
      --bg-panel-header: #f9fafb;
      --bg-input: #e5e7eb;
      --border-panel: #d1d5db;
      --border-accent: #9ca3af;
      --text-primary: #111827;
      --text-secondary: #1f2937;
      --text-muted: #4b5563;
      --text-dim: #6b7280;
      --text-dimmer: #9ca3af;
      --scrollbar-track: #e5e7eb;
      --scrollbar-thumb: #9ca3af;
      --sim-panel-bg: #fdf2f8;
      --sim-panel-border: #f9a8d4;
      --table-row-hover: #f3f4f6;
      --badge-zt-bg: #d1fae5;
      --badge-zt-color: #059669;
      --badge-sandbox-bg: #ede9fe;
      --badge-sandbox-color: #6d28d9;
      --modal-overlay: rgba(0,0,0,0.4);
    }

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-body);
      color: var(--text-secondary);
      line-height: 1.5;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

    /* ── Layout ── */
    .app { max-width: 1440px; margin: 0 auto; padding: 16px 24px 32px; }
    .header { text-align: center; padding: 20px 0 12px; border-bottom: 1px solid var(--border-panel); margin-bottom: 16px; position: relative; }
    .header h1 { font-size: 1.6rem; color: var(--text-primary); letter-spacing: 1px; }
    .header p { font-size: 0.82rem; color: var(--text-dim); margin-top: 2px; }

    /* ── Live Indicator ── */
    .live-indicator {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: #34d399; margin-top: 4px;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #34d399;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
      50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(52,211,153,0); }
    }

    /* ── View Toggle ── */
    .view-toggle {
      display: flex; justify-content: center; gap: 0; margin-bottom: 16px;
    }
    .view-toggle-btn {
      padding: 8px 24px; font-size: 0.82rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
      border: 1px solid var(--border-accent); background: var(--bg-input); color: var(--text-dim);
      transition: all 0.2s;
    }
    .view-toggle-btn:first-child { border-radius: 8px 0 0 8px; }
    .view-toggle-btn:last-child { border-radius: 0 8px 8px 0; }
    .view-toggle-btn.active {
      background: #1e3a5f; color: #60a5fa; border-color: #2563eb;
    }

    /* ── Top Bar (Status + Controls) ── */
    .top-bar {
      display: flex; gap: 16px; margin-bottom: 16px; align-items: stretch; flex-wrap: wrap;
    }
    .top-bar-status { flex: 1 1 60%; }
    .top-bar-controls { flex: 1 1 35%; min-width: 320px; }

    /* ── Mission Status ── */
    .mission-status {
      background: var(--bg-panel); border: 1px solid var(--border-panel); border-radius: 10px;
      padding: 16px 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; height: 100%;
    }
    .mission-status-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
    .mission-status-value { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .mission-status-item { text-align: center; min-width: 100px; }
    .system-badge {
      display: inline-block; padding: 4px 14px; border-radius: 12px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    }
    .system-operational { background: #163024; color: #34d399; border: 1px solid #059669; }
    .system-degraded { background: #3b3118; color: #f5c542; border: 1px solid #ca8a04; }
    .status-reason {
      font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; max-width: 200px;
    }
    .time-context {
      font-size: 0.6rem; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;
    }
    .trend-indicator { font-size: 0.72rem; margin-left: 4px; }
    .trend-up { color: #f87171; }
    .trend-down { color: #34d399; }
    .trend-stable { color: #6b7280; }

    /* ── Fault Injection Controls ── */
    .sim-panel {
      background: var(--sim-panel-bg); border: 1px solid var(--sim-panel-border); border-radius: 10px;
      padding: 12px 16px; height: 100%;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sim-panel-header {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: #fb923c; display: flex; align-items: center; gap: 6px;
    }
    .sim-btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-accent);
      background: var(--bg-input); color: var(--text-secondary); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, border-color 0.2s; width: 100%;
    }
    .sim-btn:hover { background: var(--table-row-hover); border-color: #60a5fa; }
    .sim-btn.active { background: #301a1a; border-color: #f87171; color: #f87171; }
    .sim-status { font-size: 0.68rem; color: var(--text-dimmer); }

    /* ── Pipeline Flow ── */
    .pipeline { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 18px; flex-wrap: wrap; }
    .pipeline-node {
      padding: 10px 22px; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      border: 1px solid; text-align: center; min-width: 110px;
    }
    .pipeline-arrow { font-size: 1.3rem; color: var(--border-accent); padding: 0 6px; }

    /* ── Panels ── */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--bg-panel); border: 1px solid var(--border-panel); border-radius: 10px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .panel-priority { border-color: #7f1d1d; }
    .panel-header {
      padding: 10px 16px; font-size: 0.82rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border-panel);
      display: flex; align-items: center; gap: 8px;
    }
    .panel-header-right {
      margin-left: auto; font-size: 0.65rem; font-weight: 400;
      text-transform: none; color: var(--text-dimmer); letter-spacing: 0;
    }
    .panel-body { padding: 0; overflow-y: auto; max-height: 340px; }
    .full-width { grid-column: 1 / -1; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th { background: var(--bg-panel-header); padding: 8px 12px; text-align: left; color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 1; }
    td { padding: 7px 12px; border-top: 1px solid var(--bg-input); white-space: nowrap; }
    tr:hover td { background: var(--table-row-hover); cursor: pointer; }

    /* ── Priority row highlights ── */
    tr.priority-rejected td { background: #2a1010; border-left: 3px solid #f87171; }
    tr.priority-rejected:hover td { background: #331515; }
    tr.priority-elevated td { background: #2a2010; border-left: 3px solid #fb923c; }
    tr.priority-elevated:hover td { background: #332810; }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-pending { background: #3b3118; color: #f5c542; }
    .badge-verified { background: #163024; color: #34d399; }
    .badge-rejected { background: #4a1a1a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .badge-normal { background: #163024; color: #34d399; }
    .badge-elevated { background: #3b3118; color: #fb923c; }
    .badge-critical { background: #4a1a1a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .badge-online { background: #163024; color: #34d399; }
    .badge-offline { background: #301a1a; color: #f87171; }
    .badge-zt {
      display: inline-block; padding: 1px 6px; border-radius: 8px;
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.3px;
      background: var(--badge-zt-bg); color: var(--badge-zt-color, #34d399); border: 1px solid #065f46;
    }
    .badge-zt-fail {
      background: #2a0e0e; color: #f87171; border: 1px solid #7f1d1d;
    }
    .badge-sandbox {
      display: inline-block; padding: 1px 6px; border-radius: 8px;
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.3px;
      background: var(--badge-sandbox-bg); color: var(--badge-sandbox-color, #a78bfa); border: 1px solid #5b21b6;
    }

    /* ── Progress Bar ── */
    .progress { background: var(--bg-input); border-radius: 4px; height: 8px; overflow: hidden; width: 80px; display: inline-block; vertical-align: middle; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }

    /* ── Audit Log ── */
    .log-entry { padding: 5px 14px; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.72rem; border-top: 1px solid var(--bg-input); display: flex; gap: 10px; }
    .log-entry:first-child { border-top: none; }
    .log-ts { color: var(--text-dimmer); min-width: 75px; flex-shrink: 0; }
    .log-stage { font-weight: 600; min-width: 80px; flex-shrink: 0; }
    .log-msg { color: var(--text-muted); word-break: break-word; white-space: normal; }

    /* ── Colors ── */
    .c-blue { color: #60a5fa; }
    .c-green { color: #34d399; }
    .c-purple { color: #a78bfa; }
    .c-orange { color: #fb923c; }
    .c-red { color: #f87171; }
    .c-yellow { color: #f5c542; }
    .c-dim { color: var(--text-dimmer); }

    .connecting { text-align: center; padding: 28px 16px; color: var(--text-dimmer); font-size: 0.82rem; }
    .dot-pulse::after { content: '...'; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }

    /* ── Drilldown Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: var(--modal-overlay); z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-content {
      background: var(--bg-panel); border: 1px solid var(--border-panel); border-radius: 12px;
      width: 90%; max-width: 800px; max-height: 85vh; overflow-y: auto; padding: 20px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-panel);
    }
    .modal-header h2 { font-size: 1.1rem; color: var(--text-primary); }
    .modal-close {
      background: none; border: 1px solid var(--border-accent); color: var(--text-muted); border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-size: 0.82rem;
    }
    .modal-close:hover { border-color: #f87171; color: #f87171; }
    .modal-section { margin-bottom: 16px; }
    .modal-section h3 {
      font-size: 0.82rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .detail-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
    .detail-item { flex: 1 1 180px; }
    .detail-label { font-size: 0.68rem; color: var(--text-dimmer); text-transform: uppercase; }
    .detail-value { font-size: 0.88rem; color: var(--text-primary); margin-top: 2px; }

    /* ── Issue flag ── */
    .issue-flag { color: #f87171; font-weight: 600; }
    .no-issue { color: #4b5563; }

    /* ── Analyst View ── */
    .analyst-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px;
    }
    @media (max-width: 900px) { .analyst-grid { grid-template-columns: 1fr; } }
    .analyst-card {
      background: var(--bg-panel); border: 1px solid var(--border-panel); border-radius: 10px; padding: 16px 20px;
    }
    .analyst-card-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
      margin-bottom: 12px; font-weight: 700;
    }
    .analyst-metric {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid var(--bg-input);
    }
    .analyst-metric:last-child { border-bottom: none; }
    .analyst-metric-label { font-size: 0.78rem; color: var(--text-muted); }
    .analyst-metric-value { font-size: 1rem; font-weight: 700; }

    /* ── Sandbox Panel ── */
    .sandbox-tool {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: var(--bg-panel-header); border-radius: 6px; margin-bottom: 6px;
    }
    .sandbox-tool-name { font-size: 0.78rem; font-weight: 600; color: var(--text-primary); }
    .sandbox-tool-status { font-size: 0.68rem; }
    .onboard-btn {
      padding: 6px 14px; border-radius: 8px; border: 1px solid #059669;
      background: #0e2a1e; color: #34d399; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .onboard-btn:hover { background: #163024; }

    /* ── Source stale/dim ── */
    .source-stale { opacity: 0.5; }

    /* ── Theme Toggle ── */
    .theme-toggle {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 8px;
    }
    .theme-toggle-btn {
      padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border-accent);
      background: var(--bg-input); color: var(--text-secondary); font-size: 0.75rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
    }
    .theme-toggle-btn:hover { border-color: #60a5fa; }

    /* ── Export Button ── */
    .export-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-accent);
      background: var(--bg-input); color: var(--text-muted); font-size: 0.65rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .export-btn:hover { border-color: #60a5fa; color: #60a5fa; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* Constants */
    const ANOMALY_HIGH_THRESHOLD = 0.7;
    const ANOMALY_ELEVATED_THRESHOLD = 0.4;
    const MIN_CONFIDENCE_THRESHOLD = 0.3;
    const ONLINE_TIMEOUT_MS = 30000;
    const MAX_DRILLDOWN_ROWS = 10;

    /* Multi-vendor source name mapping (9.2) */
    const VENDOR_NAMES = {
      'satellite-alpha': 'Vendor-A Satellite',
      'sensor-beta': 'Vendor-B Sensor Network',
      'payload-gamma': 'Vendor-C Payload',
    };
    const vendorName = (sid) => VENDOR_NAMES[sid] || sid;

    /* Helpers */
    const truncId = (id) => id ? id.substring(0, 8) : '—';
    const fmtTime = (ts) => {
      if (!ts) return '—';
      try { return new Date(ts).toLocaleTimeString(); }
      catch { return '—'; }
    };

    /* Export helpers */
    function downloadJSON(data, filename) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    function downloadCSV(data, filename) {
      if (!data || data.length === 0) return;
      const flat = data.map(item => {
        const row = {};
        for (const [k, v] of Object.entries(item)) {
          row[k] = typeof v === 'object' ? JSON.stringify(v) : v;
        }
        return row;
      });
      const headers = Object.keys(flat[0]);
      const csvRows = [headers.join(',')];
      for (const row of flat) {
        csvRows.push(headers.map(h => {
          const val = String(row[h] ?? '');
          return val.includes(',') || val.includes('"') || val.includes('\n')
            ? `"${val.replace(/"/g, '""')}"` : val;
        }).join(','));
      }
      const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function ExportButtons({ data, baseName }) {
      return (
        <span style={{ display: 'inline-flex', gap: 4, marginLeft: 8 }}>
          <button className="export-btn" onClick={() => downloadJSON(data, `${baseName}.json`)} title="Export JSON">JSON ↓</button>
          <button className="export-btn" onClick={() => downloadCSV(data, `${baseName}.csv`)} title="Export CSV">CSV ↓</button>
        </span>
      );
    }
    const secsAgo = (ts) => {
      if (!ts) return null;
      const diff = Math.round((Date.now() - new Date(ts).getTime()) / 1000);
      return diff >= 0 ? diff : 0;
    };

    async function apiFetch(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function enrichFusedEvents(fused, validations, analytics) {
      const valMap = {};
      for (const v of validations) {
        if (v.event_id) valMap[v.event_id] = v;
      }
      const anaMap = {};
      for (const a of analytics) {
        if (a.event_id) anaMap[a.event_id] = a;
      }
      return fused.map(f => {
        const val = valMap[f.event_id];
        const ana = anaMap[f.event_id];
        const validation_status = val ? val.status : (f.status !== 'pending' ? f.status : 'pending');
        const consensus_reached = val ? val.consensus_reached : null;
        const votes = val ? val.votes : [];
        const analytics_result = ana ? ana.result : null;
        return { ...f, validation_status, consensus_reached, votes, analytics_result };
      });
    }

    /* Trend calculation helper */
    function useTrend(currentValue) {
      const prevRef = useRef(currentValue);
      const [trend, setTrend] = useState('stable');
      useEffect(() => {
        if (currentValue > prevRef.current) setTrend('up');
        else if (currentValue < prevRef.current) setTrend('down');
        else setTrend('stable');
        prevRef.current = currentValue;
      }, [currentValue]);
      return trend;
    }

    function TrendArrow({ trend, goodWhenUp }) {
      if (trend === 'up') return <span className={`trend-indicator ${goodWhenUp ? 'trend-down' : 'trend-up'}`}>↑</span>;
      if (trend === 'down') return <span className={`trend-indicator ${goodWhenUp ? 'trend-up' : 'trend-down'}`}>↓</span>;
      return <span className="trend-indicator trend-stable">→</span>;
    }

    /* Mission Status Panel */
    function MissionStatus({ enrichedFused, events, healthData, simState }) {
      const verified = enrichedFused.filter(f => f.validation_status === 'verified').length;
      const rejected = enrichedFused.filter(f => f.validation_status === 'rejected').length;
      const pending = enrichedFused.filter(f => f.validation_status === 'pending').length;
      const offlineCount = healthData.filter(h => !h.ok).length;
      const allOnline = offlineCount === 0;
      const systemStatus = allOnline ? 'OPERATIONAL' : 'DEGRADED';
      const statusCls = allOnline ? 'system-operational' : 'system-degraded';

      const rejectedTrend = useTrend(rejected);
      const verifiedTrend = useTrend(verified);

      const reasons = [];
      if (offlineCount > 0) reasons.push(`${offlineCount} source${offlineCount > 1 ? 's' : ''} offline`);
      if (rejected > 0) reasons.push(`${rejected} rejected event${rejected > 1 ? 's' : ''}`);
      if (simState.corrupted) reasons.push('fault injection active');
      if (simState.anomaly) reasons.push('anomaly simulation active');
      const reasonText = reasons.length > 0 ? reasons.join(', ') : 'All systems nominal';

      return (
        <div className="mission-status">
          <div className="mission-status-item" style={{ minWidth: 180 }}>
            <div className="mission-status-label">System Status</div>
            <div style={{ marginTop: 4 }}><span className={`system-badge ${statusCls}`}>{systemStatus}</span></div>
            <div className="status-reason">{reasonText}</div>
          </div>
          <div className="mission-status-item">
            <div className="mission-status-label">Trusted Events</div>
            <div className="mission-status-value" style={{ color: '#34d399' }}>
              {verified}<TrendArrow trend={verifiedTrend} goodWhenUp />
            </div>
            <div className="time-context">Last 60 seconds</div>
          </div>
          <div className="mission-status-item">
            <div className="mission-status-label">Rejected (Threats)</div>
            <div className="mission-status-value" style={{ color: '#f87171' }}>
              {rejected}<TrendArrow trend={rejectedTrend} />
            </div>
            <div className="time-context">Last 60 seconds</div>
          </div>
          <div className="mission-status-item">
            <div className="mission-status-label">Pending / Review</div>
            <div className="mission-status-value" style={{ color: '#f5c542' }}>{pending}</div>
            <div className="time-context">Last 60 seconds</div>
          </div>
          <div className="mission-status-item">
            <div className="mission-status-label">Ingested</div>
            <div className="mission-status-value" style={{ color: '#60a5fa' }}>{events.length}</div>
          </div>
          <div className="mission-status-item">
            <div className="mission-status-label">Fused</div>
            <div className="mission-status-value" style={{ color: '#a78bfa' }}>{enrichedFused.length}</div>
          </div>

    }

    /* Data Flow Health */
    function DataFlowHealth({ events, fused, validations, analytics, healthData }) {
      const stages = [
        { name: 'Ingestion', key: 'ingestion', color: '#60a5fa', border: '#2563eb', count: events.length },
        { name: 'Fusion', key: 'fusion', color: '#a78bfa', border: '#7c3aed', count: fused.length },
        { name: 'Validation', key: 'validation', color: '#fb923c', border: '#ea580c', count: validations.length },
        { name: 'Analytics', key: 'analytics', color: '#34d399', border: '#059669', count: analytics.length },
      ];
      return (
        <div className="pipeline">
          {stages.map((s, i) => {
            const h = healthData.find(hd => hd.service === s.key);
            const ok = h ? h.ok : s.count > 0;
            return (
              <React.Fragment key={s.name}>
                {i > 0 && <span className="pipeline-arrow">→</span>}
                <div className="pipeline-node" style={{
                    borderColor: ok ? s.border : '#7f1d1d',
                    color: ok ? s.color : '#f87171',
                    background: ok ? `${s.border}18` : '#1a1010',
                  }}>
                  {s.name}
                  <div style={{ fontSize: '0.65rem', fontWeight: 400, marginTop: 2, opacity: 0.8 }}>
                    {ok ? '● online' : '● offline'}
                  </div>
                  <div style={{ fontSize: '0.6rem', fontWeight: 400, marginTop: 1, color: '#4b5563' }}>
                    {s.count} events
                  </div>
                </div>
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    /* Fault Injection Controls */
    function SimulationControls({ simState, onToggle }) {
      return (
        <div className="sim-panel">
          <div className="sim-panel-header">🧪 Fault Injection Controls</div>
          <button className={`sim-btn ${simState.corrupted ? 'active' : ''}`}
            onClick={() => onToggle('corrupted')}>
            {simState.corrupted ? '⚠ Injecting Corrupted Data' : '💉 Inject Corrupted Data'}
          </button>
          <button className={`sim-btn ${simState.anomaly ? 'active' : ''}`}
            onClick={() => onToggle('anomaly')}>
            {simState.anomaly ? '⚠ High Anomaly Rate' : '📈 Increase Anomaly Rate'}
          </button>
          <div className="sim-status">
            {(simState.corrupted || simState.anomaly)
              ? '⚠ Simulation active — watch metrics react'
              : 'Trigger fault scenarios to test resilience'}
          </div>
        </div>
      );
    }

    /* Priority Events Panel */
    function PriorityEventsPanel({ enrichedFused }) {
      const priorityEvents = enrichedFused.filter(f => {
        if (f.validation_status === 'rejected') return true;
        if (f.analytics_result && f.analytics_result.anomaly_score >= ANOMALY_ELEVATED_THRESHOLD) return true;
        if (f.confidence_score < MIN_CONFIDENCE_THRESHOLD) return true;
        return false;
      });
      if (priorityEvents.length === 0) {
        return <div className="connecting" style={{ color: '#34d399' }}>No priority events — system nominal</div>;
      }
      const getReason = (f) => {
        const reasons = [];
        if (f.validation_status === 'rejected') reasons.push('payload integrity failure');
        if (f.confidence_score < MIN_CONFIDENCE_THRESHOLD) reasons.push('low confidence / corrupted payload');
        if (f.analytics_result) {
          if (f.analytics_result.anomaly_score >= ANOMALY_HIGH_THRESHOLD) reasons.push('critical anomaly detected');
          else if (f.analytics_result.anomaly_score >= ANOMALY_ELEVATED_THRESHOLD) reasons.push('elevated anomaly detected');
          const factors = f.analytics_result.factors || [];
          if (factors.includes('anomaly_source_detected')) reasons.push('anomaly source');
        }
        return reasons.join('; ') || 'suspicious event';
      };
      const getAction = (f) => {
        if (f.validation_status === 'rejected') return 'Investigate source data integrity';
        if (f.analytics_result && f.analytics_result.anomaly_score >= ANOMALY_HIGH_THRESHOLD) return 'Escalate — manual review required';
        if (f.confidence_score < MIN_CONFIDENCE_THRESHOLD) return 'Quarantine — verify source health';
        return 'Monitor — review if persists';
      };
      const getRowClass = (f) => {
        if (f.validation_status === 'rejected') return 'priority-rejected';
        if (f.analytics_result && f.analytics_result.anomaly_score >= ANOMALY_ELEVATED_THRESHOLD) return 'priority-elevated';
        return '';
      };
      const getIcon = (f) => {
        if (f.validation_status === 'rejected') return '✖ ';
        if (f.analytics_result && f.analytics_result.anomaly_score >= ANOMALY_ELEVATED_THRESHOLD) return '⚠️ ';
        return '';
      };
      return (
        <table>
          <thead><tr>
            <th>Object ID</th><th>Validation</th><th>Trust</th><th>Anomaly</th><th>Reason</th><th>Recommended Action</th>
          </tr></thead>
          <tbody>
            {priorityEvents.slice(0, 20).map((f, i) => {
              const valCls = f.validation_status === 'verified' ? 'badge-verified'
                : f.validation_status === 'rejected' ? 'badge-rejected' : 'badge-pending';
              const anaCls = f.analytics_result
                ? (f.analytics_result.classification === 'critical' ? 'badge-critical'
                  : f.analytics_result.classification === 'elevated' ? 'badge-elevated' : 'badge-normal')
                : '';
              return (
                <tr key={f.event_id || i} className={getRowClass(f)}>
                  <td>{getIcon(f)}{f.object_id || '—'}</td>
                  <td><span className={`badge ${valCls}`}>{f.validation_status}</span></td>
                  <td>
                    {f.validation_status === 'verified'
                      ? <span className="badge-zt">Zero Trust Verified</span>
                      : f.validation_status === 'rejected'
                        ? <span className="badge-zt badge-zt-fail">Rejected (Integrity Failure)</span>
                        : <span className="c-dim">pending</span>}
                  </td>
                  <td>
                    {f.analytics_result
                      ? <span className={`badge ${anaCls}`}>{f.analytics_result.classification}</span>
                      : <span className="c-dim">—</span>}
                  </td>
                  <td style={{ whiteSpace: 'normal', maxWidth: 200, fontSize: '0.72rem', color: '#fb923c' }}>{getReason(f)}</td>
                  <td style={{ whiteSpace: 'normal', maxWidth: 200, fontSize: '0.72rem', color: '#9ca3af' }}>{getAction(f)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      );
    }

    /* Source Health & Trust Panel */
    function SourceHealthPanel({ events, enrichedFused, dynamicSources }) {
      const sourceMap = {};
      for (const e of events) {
        const sid = e.source_id || 'unknown';
        if (!sourceMap[sid]) {
          sourceMap[sid] = { source_id: sid, total: 0, last_seen: null, event_types: new Set() };
        }
        sourceMap[sid].total++;
        sourceMap[sid].event_types.add(e.event_type);
        if (!sourceMap[sid].last_seen || e.timestamp > sourceMap[sid].last_seen) {
          sourceMap[sid].last_seen = e.timestamp;
        }
      }
      for (const ds of dynamicSources) {
        if (!sourceMap[ds.id]) {
          sourceMap[ds.id] = { source_id: ds.id, total: ds.events || 0, last_seen: ds.addedAt, event_types: new Set(['sensor']) };
        }
      }
      const sourceApproved = {};
      const sourceTotal = {};
      const sourceAnomalyCount = {};
      for (const f of enrichedFused) {
        const sources = f.sources || [];
        for (const s of sources) {
          const sid = s.source_id;
          if (!sourceTotal[sid]) { sourceTotal[sid] = 0; sourceApproved[sid] = 0; sourceAnomalyCount[sid] = 0; }
          sourceTotal[sid]++;
          if (f.validation_status === 'verified') sourceApproved[sid]++;
          if (f.analytics_result && f.analytics_result.anomaly_score >= ANOMALY_ELEVATED_THRESHOLD) sourceAnomalyCount[sid]++;
        }
      }
      const sources = Object.values(sourceMap);
      if (sources.length === 0) return <Connecting label="source data" />;
      return (
        <table>
          <thead><tr><th>Source (Vendor)</th><th>Status</th><th>Trust Score</th><th>Events</th><th>Last Seen</th><th>Issues</th></tr></thead>
          <tbody>
            {sources.map((s, i) => {
              const total = sourceTotal[s.source_id] || 0;
              const approved = sourceApproved[s.source_id] || 0;
              const trustScore = total > 0 ? approved / total : 0;
              const anomalies = sourceAnomalyCount[s.source_id] || 0;
              const now = Date.now();
              const lastSeen = s.last_seen ? new Date(s.last_seen).getTime() : 0;
              const isOnline = (now - lastSeen) < ONLINE_TIMEOUT_MS;
              const lastSeenSecs = secsAgo(s.last_seen);
              const isStale = !isOnline;
              const trustColor = trustScore >= ANOMALY_HIGH_THRESHOLD ? '#34d399' : trustScore >= ANOMALY_ELEVATED_THRESHOLD ? '#f5c542' : '#f87171';
              const hasIssues = anomalies > 0 || trustScore < 0.5;
              return (
                <tr key={s.source_id || i} className={isStale ? 'source-stale' : ''}>
                  <td style={{ fontWeight: 600 }}>{vendorName(s.source_id)}</td>
                  <td>
                    <span className={`badge ${isOnline ? 'badge-online' : 'badge-offline'}`}>{isOnline ? 'online' : 'offline'}</span>
                    {!isOnline && lastSeenSecs != null && (
                      <span style={{ fontSize: '0.65rem', color: '#6b7280', marginLeft: 4 }}>(last seen {lastSeenSecs}s ago)</span>
                    )}
                  </td>
                  <td className={isStale ? 'source-stale' : ''}>
                    <div className="progress" style={{ width: 60 }}>
                      <div className="progress-fill" style={{ width: `${trustScore * 100}%`, background: isStale ? '#4b5563' : trustColor }} />
                    </div>
                    <span style={{ marginLeft: 6, fontSize: '0.72rem', color: isStale ? '#4b5563' : trustColor }}>{(trustScore * 100).toFixed(0)}%</span>
                  </td>
                  <td>{s.total}</td>
                  <td className="c-dim">{fmtTime(s.last_seen)}</td>
                  <td>
                    {hasIssues
                      ? <span className="issue-flag">{anomalies > 0 ? `${anomalies} anomalies` : 'low trust'}</span>
                      : <span className="no-issue">—</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      );
    }

    /* Enriched Fused Events Panel */
    function FusedEventsPanel({ enrichedFused, onSelect }) {
      if (enrichedFused.length === 0) return <Connecting label="fused events" />;
      return (
        <table>
          <thead><tr>
            <th>Event ID</th><th>Object ID</th><th>Sources</th><th>Confidence</th><th>Validation</th><th>Trust</th><th>Analytics</th><th>Time</th>
          </tr></thead>
          <tbody>
            {enrichedFused.slice(0, 30).map((f, i) => {
              const srcCount = Array.isArray(f.sources) ? f.sources.length : '—';
              const valCls = f.validation_status === 'verified' ? 'badge-verified'
                : f.validation_status === 'rejected' ? 'badge-rejected' : 'badge-pending';
              const conf = f.confidence_score ?? f.confidence;
              const confColor = conf >= ANOMALY_HIGH_THRESHOLD ? '#34d399' : conf >= ANOMALY_ELEVATED_THRESHOLD ? '#f5c542' : '#f87171';
              const anaCls = f.analytics_result
                ? (f.analytics_result.classification === 'critical' ? 'badge-critical'
                  : f.analytics_result.classification === 'elevated' ? 'badge-elevated' : 'badge-normal')
                : '';
              return (
                <tr key={f.event_id || i} onClick={() => onSelect && onSelect(f)}>
                  <td className="c-dim">{truncId(f.event_id)}</td>
                  <td>{f.object_id || '—'}</td>
                  <td>{srcCount}</td>
                  <td><span style={{ color: confColor, fontWeight: 600 }}>{conf != null ? `${(conf * 100).toFixed(0)}%` : '—'}</span></td>
                  <td><span className={`badge ${valCls}`}>{f.validation_status}</span></td>
                  <td>
                    {f.validation_status === 'verified'
                      ? <span className="badge-zt">Verified via Consensus</span>
                      : f.validation_status === 'rejected'
                        ? <span className="badge-zt badge-zt-fail">Rejected (Integrity Failure)</span>
                        : <span className="c-dim">—</span>}
                  </td>
                  <td>
                    {f.analytics_result
                      ? <span className={`badge ${anaCls}`}>{f.analytics_result.classification}</span>
                      : <span className="c-dim">—</span>}
                  </td>
                  <td className="c-dim">{fmtTime(f.timestamp)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      );
    }

    /* Validation Panel */
    function ValidationPanel({ validations }) {
      if (validations.length === 0) return <Connecting label="validations" />;
      return (
        <table>
          <thead><tr><th>Event ID</th><th>Status</th><th>Votes</th><th>Consensus</th></tr></thead>
          <tbody>
            {validations.slice(0, 20).map((v, i) => {
              const badgeCls = v.status === 'verified' ? 'badge-verified'
                : v.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
              const votes = v.votes || [];
              return (
                <tr key={v.event_id || i}>
                  <td className="c-dim">{truncId(v.event_id)}</td>
                  <td><span className={`badge ${badgeCls}`}>{v.status || '—'}</span></td>
                  <td>
                    {votes.map((vote, vi) => (
                      <span key={vi} style={{ marginRight: 4 }}>
                        {vote.vote === 'approve' ? <span className="c-green">✓</span> : <span className="c-red">✗</span>}
                      </span>
                    ))}
                    {votes.length === 0 && '—'}
                  </td>
                  <td>{v.consensus_reached != null ? (v.consensus_reached ? 'Yes' : 'No') : '—'}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      );
    }

    /* Analytics Panel */
    function AnalyticsPanel({ analytics }) {
      if (analytics.length === 0) return <Connecting label="analytics" />;
      const barColor = (score) => {
        if (score >= ANOMALY_HIGH_THRESHOLD) return '#f87171';
        if (score >= ANOMALY_ELEVATED_THRESHOLD) return '#fb923c';
        return '#34d399';
      };
      return (
        <table>
          <thead><tr><th>Event ID</th><th>Classification</th><th>Anomaly Score</th><th>Factors</th></tr></thead>
          <tbody>
            {analytics.slice(0, 20).map((a, i) => {
              const r = a.result || {};
              const cls = r.classification || 'normal';
              const badgeCls = cls === 'critical' ? 'badge-critical' : cls === 'elevated' ? 'badge-elevated' : 'badge-normal';
              const score = r.anomaly_score ?? 0;
              const factors = r.factors || [];
              return (
                <tr key={a.event_id || i}>
                  <td className="c-dim">{truncId(a.event_id)}</td>
                  <td><span className={`badge ${badgeCls}`}>{cls}</span></td>
                  <td>
                    <div className="progress"><div className="progress-fill" style={{ width: `${score * 100}%`, background: barColor(score) }} /></div>
                    <span style={{ marginLeft: 6, fontSize: '0.72rem' }}>{(score * 100).toFixed(0)}%</span>
                  </td>
                  <td style={{ fontSize: '0.7rem', color: '#6b7280', whiteSpace: 'normal', maxWidth: 200 }}>
                    {Array.isArray(factors) ? factors.join(', ') : (factors || '—')}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      );
    }

    /* Audit Log */
    function AuditLogPanel({ logs }) {
      const containerRef = useRef(null);
      const wasAtBottomRef = useRef(true);
      const AUTO_SCROLL_THRESHOLD = 30;
      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;
        if (wasAtBottomRef.current) {
          el.scrollTop = el.scrollHeight;
        }
      }, [logs]);
      const handleScroll = () => {
        const el = containerRef.current;
        if (!el) return;
        wasAtBottomRef.current = (el.scrollHeight - el.scrollTop - el.clientHeight) < AUTO_SCROLL_THRESHOLD;
      };
      const stageColor = { ingestion: 'c-blue', fusion: 'c-purple', validation: 'c-orange', analytics: 'c-green' };
      if (logs.length === 0) return <Connecting label="audit logs" />;
      return (
        <div ref={containerRef} onScroll={handleScroll} style={{ maxHeight: 300, overflowY: 'auto' }}>
          {logs.slice(-100).map((l, i) => (
            <div className="log-entry" key={i}>
              <span className="log-ts">{fmtTime(l.timestamp)}</span>
              <span className={`log-stage ${stageColor[l.stage] || ''}`}>[{l.stage || '?'}]</span>
              <span className="log-msg">{l.message || l.action || JSON.stringify(l)}</span>
            </div>
          ))}
        </div>
      );
    }

    /* Analytics Sandbox Panel (9.1) */
    function AnalyticsSandboxPanel() {
      const [tools, setTools] = useState([
        { name: 'anomaly-detector-v1', vendor: 'Internal', status: 'ACTIVE', sandboxed: true, inputPolicy: 'verified-only', lastExec: new Date().toISOString() },
        { name: 'threat-correlator', vendor: 'Internal', status: 'ACTIVE', sandboxed: true, inputPolicy: 'verified-only', lastExec: new Date().toISOString() },
        { name: 'Vendor-C Threat Correlator', vendor: 'Vendor-C', status: 'AVAILABLE', sandboxed: false, inputPolicy: null, lastExec: null },
      ]);
      const onboardTool = (index) => {
        setTools(prev => prev.map((t, i) => {
          if (i !== index) return t;
          return { ...t, status: 'ACTIVE', sandboxed: true, inputPolicy: 'verified-only', lastExec: new Date().toISOString() };
        }));
      };
      const hasAvailable = tools.some(t => t.status === 'AVAILABLE');
      const loadNewTool = () => {
        const VENDOR_LETTERS = ['D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];
        const externalCount = tools.filter(t => t.vendor !== 'Internal').length;
        const letter = VENDOR_LETTERS[externalCount] || `X${externalCount}`;
        const newTool = {
          name: `custom-analytics-${Date.now().toString(36).slice(-4)}`,
          vendor: `Vendor-${letter}`,
          status: 'AVAILABLE',
          sandboxed: false,
          inputPolicy: null,
          lastExec: null,
        };
        setTools(prev => [...prev, newTool]);
      };
      return (
        <div>
          <div style={{ padding: '10px 14px', fontSize: '0.7rem', color: '#6b7280' }}>
            Analytics run only on <span className="c-green" style={{ fontWeight: 600 }}>VERIFIED</span> data
            <span className="badge-sandbox" style={{ marginLeft: 8 }}>Sandboxed Execution</span>
          </div>
          {tools.map((t, i) => (
            <div className="sandbox-tool" key={i} style={{ flexWrap: 'wrap', gap: 6 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: '1 1 auto' }}>
                <span className="sandbox-tool-name">{t.name}</span>
                <span style={{ fontSize: '0.62rem', color: '#6b7280' }}>({t.vendor})</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span className={`sandbox-tool-status ${t.status === 'ACTIVE' ? 'c-green' : 'c-yellow'}`}>{t.status}</span>
                {t.sandboxed && <span className="badge-sandbox">Sandboxed</span>}
                {t.inputPolicy && <span style={{ fontSize: '0.6rem', color: '#34d399' }}>Input: {t.inputPolicy}</span>}
                {t.lastExec && <span style={{ fontSize: '0.6rem', color: '#4b5563' }}>Last exec: {fmtTime(t.lastExec)}</span>}
                {t.status === 'AVAILABLE' && (
                  <button className="onboard-btn" style={{ padding: '3px 10px', fontSize: '0.65rem' }} onClick={() => onboardTool(i)}>Onboard</button>
                )}
              </div>
            </div>
          ))}
          <div style={{ padding: '8px 12px' }}>
            <button className="onboard-btn" onClick={loadNewTool}>+ Load New Analytics Tool</button>
          </div>
        </div>
      );
    }

    /* Analyst View */
    function AnalystView({ enrichedFused, validations, analytics }) {
      const verified = enrichedFused.filter(f => f.validation_status === 'verified').length;
      const rejected = enrichedFused.filter(f => f.validation_status === 'rejected').length;
      const pending = enrichedFused.filter(f => f.validation_status === 'pending').length;
      const total = enrichedFused.length || 1;
      const verifiedPct = ((verified / total) * 100).toFixed(0);
      const rejectedPct = ((rejected / total) * 100).toFixed(0);
      const pendingPct = ((pending / total) * 100).toFixed(0);
      const consensusSuccess = enrichedFused.filter(f => f.consensus_reached === true).length;
      const consensusTotal = enrichedFused.filter(f => f.consensus_reached != null).length;
      const consensusPct = consensusTotal > 0 ? ((consensusSuccess / consensusTotal) * 100).toFixed(0) : '—';

      const confidences = enrichedFused.map(f => f.confidence_score ?? f.confidence ?? 0);
      const avgConfidence = confidences.length > 0 ? (confidences.reduce((a, b) => a + b, 0) / confidences.length * 100).toFixed(0) : '—';
      const sourceCounts = enrichedFused.map(f => Array.isArray(f.sources) ? f.sources.length : 0);
      const avgSources = sourceCounts.length > 0 ? (sourceCounts.reduce((a, b) => a + b, 0) / sourceCounts.length).toFixed(1) : '—';

      const classifications = enrichedFused.reduce((acc, f) => {
        const cls = f.analytics_result ? f.analytics_result.classification : 'normal';
        acc[cls] = (acc[cls] || 0) + 1;
        return acc;
      }, {});
      const clsTotal = Object.values(classifications).reduce((a, b) => a + b, 0) || 1;
      const normalPct = (((classifications.normal || 0) / clsTotal) * 100).toFixed(0);
      const elevatedPct = (((classifications.elevated || 0) / clsTotal) * 100).toFixed(0);
      const criticalPct = (((classifications.critical || 0) / clsTotal) * 100).toFixed(0);

      return (
        <div>
          <div className="analyst-grid">
            <div className="analyst-card">
              <div className="analyst-card-title">📋 Validation Metrics</div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Verified</span>
                <span className="analyst-metric-value c-green">{verifiedPct}%</span>
              </div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Rejected</span>
                <span className="analyst-metric-value c-red">{rejectedPct}%</span>
              </div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Pending</span>
                <span className="analyst-metric-value c-yellow">{pendingPct}%</span>
              </div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Consensus Success Rate</span>
                <span className="analyst-metric-value c-green">{consensusPct}%</span>
              </div>
              <div className="time-context" style={{ marginTop: 8 }}>Based on last 60 seconds of data</div>
            </div>
            <div className="analyst-card">
              <div className="analyst-card-title">🔗 Fusion Metrics</div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Avg Confidence</span>
                <span className="analyst-metric-value" style={{ color: '#a78bfa' }}>{avgConfidence}%</span>
              </div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Avg Sources / Event</span>
                <span className="analyst-metric-value" style={{ color: '#60a5fa' }}>{avgSources}</span>
              </div>
              <div className="time-context" style={{ marginTop: 8 }}>Based on last 60 seconds of data</div>
            </div>
            <div className="analyst-card">
              <div className="analyst-card-title">📊 Analytics Distribution</div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Normal</span>
                <span className="analyst-metric-value c-green">{normalPct}%</span>
              </div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Elevated</span>
                <span className="analyst-metric-value c-orange">{elevatedPct}%</span>
              </div>
              <div className="analyst-metric">
                <span className="analyst-metric-label">Critical</span>
                <span className="analyst-metric-value c-red">{criticalPct}%</span>
              </div>
              <div className="time-context" style={{ marginTop: 8 }}>Based on last 60 seconds of data</div>
            </div>
          </div>
          <div className="grid">
            <div className="panel">
              <div className="panel-header"><span className="c-orange">●</span> Validation Status
                <span className="panel-header-right">Last 60 seconds</span>
              </div>
              <div className="panel-body"><ValidationPanel validations={validations} /></div>
            </div>
            <div className="panel">
              <div className="panel-header"><span className="c-green">●</span> Analytics Output
                <span className="panel-header-right">Last 60 seconds</span>
              </div>
              <div className="panel-body"><AnalyticsPanel analytics={analytics} /></div>
            </div>
          </div>
        </div>
      );
    }

    /* Object Drilldown Modal */
    function DrilldownModal({ event, events, enrichedFused, validations, analytics, onClose }) {
      if (!event) return null;
      const rawForObject = events.filter(e => e.object_id === event.object_id);
      const fusedForObject = enrichedFused.filter(f => f.object_id === event.object_id);
      const valResult = validations.find(v => v.event_id === event.event_id);
      const anaResult = analytics.find(a => a.event_id === event.event_id);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>🔍 Object Drilldown: {event.object_id}</h2>
              <button className="modal-close" onClick={onClose}>✕ Close</button>
            </div>
            <div className="modal-section">
              <h3>Event Details</h3>
              <div className="detail-row">
                <div className="detail-item">
                  <div className="detail-label">Event ID</div>
                  <div className="detail-value">{event.event_id}</div>
                </div>
                <div className="detail-item">
                  <div className="detail-label">Object ID</div>
                  <div className="detail-value">{event.object_id}</div>
                </div>
                <div className="detail-item">
                  <div className="detail-label">Confidence Score</div>
                  <div className="detail-value" style={{ color: event.confidence_score >= 0.7 ? '#34d399' : event.confidence_score >= 0.4 ? '#f5c542' : '#f87171' }}>
                    {(event.confidence_score * 100).toFixed(0)}%
                  </div>
                </div>
                <div className="detail-item">
                  <div className="detail-label">Validation Status</div>
                  <div className="detail-value">
                    <span className={`badge badge-${event.validation_status}`}>{event.validation_status}</span>
                    {event.validation_status === 'verified' && <span className="badge-zt" style={{ marginLeft: 6 }}>Zero Trust Verified</span>}
                  </div>
                </div>
              </div>
            </div>
            <div className="modal-section">
              <h3>Raw Source Events ({rawForObject.length})</h3>
              {rawForObject.length > 0 ? (
                <table>
                  <thead><tr><th>Event ID</th><th>Source</th><th>Type</th><th>Time</th></tr></thead>
                  <tbody>
                    {rawForObject.slice(-MAX_DRILLDOWN_ROWS).reverse().map((e, i) => (
                      <tr key={e.event_id || i}>
                        <td className="c-dim">{truncId(e.event_id)}</td>
                        <td>{vendorName(e.source_id)}</td>
                        <td>{e.event_type}</td>
                        <td className="c-dim">{fmtTime(e.timestamp)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : <div className="connecting">No raw events found</div>}
            </div>
            <div className="modal-section">
              <h3>Fused Event History ({fusedForObject.length})</h3>
              {fusedForObject.length > 0 ? (
                <table>
                  <thead><tr><th>Event ID</th><th>Sources</th><th>Confidence</th><th>Status</th><th>Time</th></tr></thead>
                  <tbody>
                    {fusedForObject.slice(-MAX_DRILLDOWN_ROWS).reverse().map((f, i) => (
                      <tr key={f.event_id || i}>
                        <td className="c-dim">{truncId(f.event_id)}</td>
                        <td>{(f.sources || []).length}</td>
                        <td>{(f.confidence_score * 100).toFixed(0)}%</td>
                        <td><span className={`badge badge-${f.validation_status}`}>{f.validation_status}</span></td>
                        <td className="c-dim">{fmtTime(f.timestamp)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : <div className="connecting">No fused events</div>}
            </div>
            {valResult && (
              <div className="modal-section">
                <h3>Validation Votes</h3>
                <table>
                  <thead><tr><th>Validator</th><th>Vote</th><th>Hash (prefix)</th><th>Time</th></tr></thead>
                  <tbody>
                    {(valResult.votes || []).map((vote, vi) => (
                      <tr key={vi}>
                        <td className="c-dim">{truncId(vote.validator_id)}</td>
                        <td>{vote.vote === 'approve' ? <span className="c-green">✓ approve</span> : <span className="c-red">✗ reject</span>}</td>
                        <td className="c-dim">{vote.hash ? vote.hash.substring(0, 12) + '…' : '—'}</td>
                        <td className="c-dim">{fmtTime(vote.timestamp)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div style={{ marginTop: 8, fontSize: '0.78rem' }}>
                  Consensus: {valResult.consensus_reached ? <span className="c-green">Reached</span> : <span className="c-red">Not reached</span>}
                </div>
              </div>
            )}
            {anaResult && (
              <div className="modal-section">
                <h3>Analytics Result</h3>
                <div className="detail-row">
                  <div className="detail-item">
                    <div className="detail-label">Classification</div>
                    <div className="detail-value"><span className={`badge badge-${anaResult.result.classification}`}>{anaResult.result.classification}</span></div>
                  </div>
                  <div className="detail-item">
                    <div className="detail-label">Anomaly Score</div>
                    <div className="detail-value">{(anaResult.result.anomaly_score * 100).toFixed(0)}%</div>
                  </div>
                  <div className="detail-item">
                    <div className="detail-label">Factors</div>
                    <div className="detail-value" style={{ fontSize: '0.78rem', color: '#9ca3af' }}>{(anaResult.result.factors || []).join(', ') || '—'}</div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* Connecting placeholder */
    function Connecting({ label }) {
      return <div className="connecting">Connecting to {label}<span className="dot-pulse" /></div>;
    }

    /* App */
    function App() {
      const [events, setEvents] = useState([]);
      const [fused, setFused] = useState([]);
      const [validations, setValidations] = useState([]);
      const [analytics, setAnalytics] = useState([]);
      const [logs, setLogs] = useState([]);
      const [healthData, setHealthData] = useState([]);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [simState, setSimState] = useState({ corrupted: false, anomaly: false });
      const [activeView, setActiveView] = useState('command');
      const [lastUpdated, setLastUpdated] = useState(null);
      const [dynamicSources, setDynamicSources] = useState([]);
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('tfg-theme') || 'dark'; }
        catch { return 'dark'; }
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('tfg-theme', theme); } catch {}
      }, [theme]);

      const toggleTheme = useCallback(() => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      }, []);

      const poll = useCallback(async () => {
        const safe = async (url) => {
          try { return await apiFetch(url); }
          catch { return null; }
        };
        const safeHealth = async (service) => {
          try {
            await apiFetch(`/api/${service}/health`);
            return { service, ok: true };
          } catch {
            return { service, ok: false };
          }
        };
        const [evRes, fuRes, vaRes, anRes, logI, logF, logV, logA, hIng, hFus, hVal, hAna] = await Promise.all([
          safe('/api/ingestion/events?limit=50'),
          safe('/api/fusion/fused-events?limit=50'),
          safe('/api/validation/validations?limit=50'),
          safe('/api/analytics/results?limit=50'),
          safe('/api/ingestion/audit'),
          safe('/api/fusion/audit'),
          safe('/api/validation/audit'),
          safe('/api/analytics/audit'),
          safeHealth('ingestion'),
          safeHealth('fusion'),
          safeHealth('validation'),
          safeHealth('analytics'),
        ]);
        if (evRes) setEvents(Array.isArray(evRes) ? evRes : (evRes.events || []));
        if (fuRes) setFused(Array.isArray(fuRes) ? fuRes : (fuRes.events || fuRes.fusedEvents || []));
        if (vaRes) setValidations(Array.isArray(vaRes) ? vaRes : (vaRes.validations || []));
        if (anRes) setAnalytics(Array.isArray(anRes) ? anRes : (anRes.results || []));
        setHealthData([hIng, hFus, hVal, hAna]);
        setLastUpdated(new Date());
        setDynamicSources(prev => prev.map(ds => ({
          ...ds,
          events: ds.events + Math.floor(Math.random() * 3),
          last_seen: new Date().toISOString(),
        })));
        const merged = [
          ...((logI && (Array.isArray(logI) ? logI : logI.entries || [])) || []).map(e => ({ ...e, stage: e.stage || 'ingestion' })),
          ...((logF && (Array.isArray(logF) ? logF : logF.entries || [])) || []).map(e => ({ ...e, stage: e.stage || 'fusion' })),
          ...((logV && (Array.isArray(logV) ? logV : logV.entries || [])) || []).map(e => ({ ...e, stage: e.stage || 'validation' })),
          ...((logA && (Array.isArray(logA) ? logA : logA.entries || [])) || []).map(e => ({ ...e, stage: e.stage || 'analytics' })),
        ].sort((a, b) => new Date(a.timestamp || 0) - new Date(b.timestamp || 0));
        setLogs(merged);
      }, []);

      useEffect(() => {
        poll();
        const id = setInterval(poll, 2000);
        return () => clearInterval(id);
      }, [poll]);

      const handleSimToggle = useCallback(async (type) => {
        setSimState(prev => {
          const next = { ...prev, [type]: !prev[type] };
          if (!prev[type]) {
            const objects = ['OBJ-001', 'OBJ-002', 'OBJ-003'];
            const burst = type === 'corrupted'
              ? objects.map(obj => ({
                  source_id: 'sensor-beta', event_type: 'sensor', object_id: obj,
                  timestamp: new Date().toISOString(),
                  payload: { sensor_type: 'radar', reading: 999, threshold: 100, corrupted: true },
                }))
              : objects.map(obj => ({
                  source_id: 'sensor-beta', event_type: 'anomaly', object_id: obj,
                  timestamp: new Date().toISOString(),
                  payload: { sensor_type: 'infrared', reading: 950, threshold: 200, anomaly_detected: true },
                }));
            burst.forEach(ev => {
              fetch('/api/ingestion/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(ev) }).catch(() => {});
            });
            objects.forEach(obj => {
              fetch('/api/ingestion/events', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source_id: 'satellite-alpha', event_type: type === 'anomaly' ? 'anomaly' : 'tracking', object_id: obj,
                  timestamp: new Date().toISOString(), payload: { latitude: 0, longitude: 0, altitude: 400, velocity: 2, heading: 90 } }),
              }).catch(() => {});
            });
            setTimeout(() => poll(), 1500);
            setTimeout(() => poll(), 3000);
          }
          return next;
        });
      }, [poll]);

      const handleAddSource = useCallback(() => {
        const srcNum = dynamicSources.length + 1;
        const id = `vendor-new-${srcNum}-sensor-${Date.now().toString(36).slice(-4)}`;
        const newSrc = { id, addedAt: new Date().toISOString(), events: 0 };
        setDynamicSources(prev => [...prev, newSrc]);
        VENDOR_NAMES[id] = `New Vendor-${srcNum} Sensor`;
      }, [dynamicSources.length]);

      const enrichedFused = useMemo(
        () => enrichFusedEvents(fused, validations, analytics),
        [fused, validations, analytics]
      );

      const updatedAgo = lastUpdated ? Math.round((Date.now() - lastUpdated.getTime()) / 1000) : null;

      return (
        <div className="app">
          <header className="header">
            <h1>🛰 Trusted Fusion Gateway</h1>
            <p>Zero-Trust Multi-Source Data Fusion — Decision Support Platform</p>
            <div className="live-indicator">
              <span className="live-dot"></span>
              Live Data Stream
              {lastUpdated && (
                <span style={{ color: 'var(--text-dim)', marginLeft: 8 }}>
                  Updated {updatedAgo != null && updatedAgo <= 60 ? `${updatedAgo}s ago` : 'just now'}
                </span>
              )}
            </div>
            <div className="theme-toggle">
              <button className="theme-toggle-btn" onClick={toggleTheme}>
                {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
              </button>
            </div>
          </header>

          <div className="view-toggle">
            <button className={`view-toggle-btn ${activeView === 'command' ? 'active' : ''}`}
              onClick={() => setActiveView('command')}>⚡ Command View</button>
            <button className={`view-toggle-btn ${activeView === 'analyst' ? 'active' : ''}`}
              onClick={() => setActiveView('analyst')}>📊 Analyst View</button>
          </div>

          <div className="top-bar">
            <div className="top-bar-status">
              <MissionStatus enrichedFused={enrichedFused} events={events} healthData={healthData} simState={simState} />
            </div>
            <div className="top-bar-controls">
              <SimulationControls simState={simState} onToggle={handleSimToggle} />
            </div>
          </div>

          <DataFlowHealth events={events} fused={fused} validations={validations} analytics={analytics} healthData={healthData} />

          {activeView === 'command' ? (
            <div className="grid">
              <div className="panel full-width panel-priority">
                <div className="panel-header">
                  <span className="c-red">🚨</span> Priority Events
                  <span className="panel-header-right">Last 60 seconds</span>
                </div>
                <div className="panel-body"><PriorityEventsPanel enrichedFused={enrichedFused} /></div>
              </div>

              <div className="panel full-width">
                <div className="panel-header">
                  <span className="c-blue">🛰️</span> Source Health &amp; Trust (Multi-Vendor)
                  <span className="panel-header-right">
                    Last 5 minutes
                    <button className="onboard-btn" style={{ marginLeft: 10 }} onClick={handleAddSource}>+ Add New Data Source</button>
                  </span>
                </div>
                <div className="panel-body"><SourceHealthPanel events={events} enrichedFused={enrichedFused} dynamicSources={dynamicSources} /></div>
              </div>

              <div className="panel full-width">
                <div className="panel-header">
                  <span className="c-purple">●</span> Fused Events (Enriched)
                  <span className="panel-header-right">
                    Last 60 seconds
                    <ExportButtons data={enrichedFused} baseName="fused-events-export" />
                  </span>
                </div>
                <div className="panel-body"><FusedEventsPanel enrichedFused={enrichedFused} onSelect={setSelectedEvent} /></div>
              </div>

              <div className="panel">
                <div className="panel-header"><span className="c-orange">●</span> Validation Status
                  <span className="panel-header-right">
                    Last 60 seconds
                    <ExportButtons data={validations} baseName="validation-results-export" />
                  </span>
                </div>
                <div className="panel-body"><ValidationPanel validations={validations} /></div>
              </div>
              <div className="panel">
                <div className="panel-header"><span className="c-green">●</span> Analytics Output
                  <span className="panel-header-right">
                    Last 60 seconds
                    <ExportButtons data={analytics} baseName="analytics-results-export" />
                  </span>
                </div>
                <div className="panel-body"><AnalyticsPanel analytics={analytics} /></div>
              </div>

              <div className="panel">
                <div className="panel-header"><span className="c-purple">🧪</span> Analytics Tools / Sandbox Environment</div>
                <div className="panel-body"><AnalyticsSandboxPanel /></div>
              </div>
              <div className="panel">
                <div className="panel-header">
                  📋 Audit Log
                  <span className="panel-header-right">
                    <ExportButtons data={logs} baseName="audit-log-export" />
                  </span>
                </div>
                <div className="panel-body"><AuditLogPanel logs={logs} /></div>
              </div>

              <div className="panel full-width">
                <div className="panel-header">
                  📡 Raw Events
                  <span className="panel-header-right">
                    <ExportButtons data={events} baseName="raw-events-export" />
                  </span>
                </div>
              </div>
            </div>
          ) : (
            <AnalystView enrichedFused={enrichedFused} validations={validations} analytics={analytics} />
          )}

          {selectedEvent && (
            <DrilldownModal event={selectedEvent} events={events} enrichedFused={enrichedFused}
              validations={validations} analytics={analytics} onClose={() => setSelectedEvent(null)} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
